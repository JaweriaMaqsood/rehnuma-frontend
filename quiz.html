rent bodies", "are equal and act on the same body", "cancel each other because they act on the same body", "are always unequal"], "y": "Action and reaction are equal and opposite, but they act on two different bodies, so they do not cancel each other."}}, {"k": "newton-laws-of-motion", "r": {"q": "Kisi jism ki inertia kis par depend karti hai?", "o": ["Us ke mass par", "Us ki raftaar par", "Us ke rang par", "Us ki jagah par"], "y": "Mass jitna zyada ho, inertia utni zyada hoti hai."}, "e": {"q": "The inertia of an object depends on its:", "o": ["Mass", "Speed", "Colour", "Position"], "y": "The greater the mass, the greater the inertia."}}, {"k": "newton-laws-of-motion", "r": {"q": "Momentum ka formula kya hai?", "o": ["p = mv", "p = ma", "p = m/v", "p = F/t"], "y": "Momentum mass aur velocity ka hasil e zarb hai, yani p = mv. Unit kg m/s."}, "e": {"q": "What is the formula for momentum?", "o": ["p = mv", "p = ma", "p = m/v", "p = F/t"], "y": "Momentum is the product of mass and velocity: p = mv. Unit: kg m/s."}}, {"k": "newton-laws-of-motion", "r": {"q": "Raaket ke oopar jane ki wajah kaun sa law hai?", "o": ["Newton ka teesra law", "Newton ka pehla law", "Newton ka doosra law", "Boyle ka law"], "y": "Raaket gas ko neeche dhakelta hai (action), aur gas raaket ko oopar dhakelti hai (reaction). Ye teesra law hai."}, "e": {"q": "Which law explains why a rocket rises?", "o": ["Newton's third law", "Newton's first law", "Newton's second law", "Boyle's law"], "y": "The rocket pushes gas downward (action) and the gas pushes the rocket upward (reaction). This is the third law."}}, {"k": "newton-laws-of-motion", "r": {"q": "Agar kisi jism par lagne wali net force zero ho, to jism:", "o": ["rest ya yaksan raftaar se seedhi line me chalta rehta hai", "hamesha rukk jata hai", "tezi se barhta jata hai", "ghoomne lagta hai"], "y": "Pehle law ke mutabiq net force zero ho to velocity nahi badalti."}, "e": {"q": "If the net force on an object is zero, the object:", "o": ["stays at rest or keeps moving in a straight line at constant speed", "always stops", "keeps speeding up", "starts to rotate"], "y": "By the first law, velocity does not change when the net force is zero."}}, {"k": "newton-laws-of-motion", "r": {"q": "Bus achanak brake lagaye to musafir aage ki taraf jhuk jate hain. Iski wajah kya hai?", "o": ["Inertia", "Gravity", "Friction", "Buoyancy"], "y": "Musafiron ka jism apni motion ki halat me rehna chahta hai, isliye aage jhukta hai."}, "e": {"q": "When a bus brakes suddenly, passengers lurch forward. Why?", "o": ["Inertia", "Gravity", "Friction", "Buoyancy"], "y": "The passengers' bodies tend to stay in their state of motion, so they move forward."}}, {"k": "newton-laws-of-motion", "r": {"q": "2 kg ke jism ko 3 m/s² ka acceleration dene ke liye kitni force chahiye?", "o": ["6 N", "1.5 N", "5 N", "0.67 N"], "y": "F = ma = 2 × 3 = 6 N."}, "e": {"q": "What force is needed to give a 2 kg object an acceleration of 3 m/s²?", "o": ["6 N", "1.5 N", "5 N", "0.67 N"], "y": "F = ma = 2 × 3 = 6 N."}}, {"k": "newton-laws-of-motion", "r": {"q": "10 kg ke jism ka weight zameen par kitna hoga? (g = 9.8 m/s²)", "o": ["98 N", "10 N", "9.8 N", "980 N"], "y": "Weight W = mg = 10 × 9.8 = 98 N."}, "e": {"q": "What is the weight of a 10 kg object on Earth? (g = 9.8 m/s²)", "o": ["98 N", "10 N", "9.8 N", "980 N"], "y": "Weight W = mg = 10 × 9.8 = 98 N."}}, {"k": "newton-laws-of-motion", "r": {"q": "1 newton barabar hai:", "o": ["1 kg m/s²", "1 kg m/s", "1 g m/s²", "1 kg m²/s²"], "y": "F = ma se 1 N = 1 kg × 1 m/s² = 1 kg m/s²."}, "e": {"q": "One newton is equal to:", "o": ["1 kg m/s²", "1 kg m/s", "1 g m/s²", "1 kg m²/s²"], "y": "From F = ma, 1 N = 1 kg × 1 m/s² = 1 kg m/s²."}}, {"k": "periodic-table-chemistry", "r": {"q": "Modern periodic law ke mutabiq elements ki properties kis ka periodic function hain?", "o": ["Atomic number", "Atomic mass", "Number of neutrons", "Atomic radius"], "y": "Moseley ke kaam ke baad periodic law atomic number par mabni hai   h+='<button class="sub" type="button" data-k="mix"><span class="ic">🎯</span><span><b>'+x.mix+'</b><span class="m">'+x.mixm+(best('mix')?' &middot; '+x.best+': '+best('mix'):'')+'</span></span></button>';
  SUBJECTS.forEach(function(s){h+='<button class="sub" type="button" data-k="'+esc(s.key)+'"><span class="ic">'+s.icon+'</span><span><b>'+esc(sname(s))+'</b><span class="m">'+esc(slevel(s))+(best(s.key)?' &middot; '+x.best+': '+best(s.key):'')+'</span></span></button>'});
  h+='</div><h2>'+x.readH+'</h2><div class="links"><a href="/mcqs.html">'+x.all+'</a><a href="/guides.html">'+x.guides+'</a><a href="/">'+x.tutor+'</a></div>';
  h+='<footer>'+x.disc+'<a href="/about.html">Javeria Maqsood</a>.</footer>';
  scr.innerHTML=h;scr.scrollTop=0;
  Array.prototype.forEach.call(scr.querySelectorAll('.sub'),function(b){b.onclick=function(){start(b.getAttribute('data-k'))}});
}
function goHome(){view='home';st=null;render()}
function start(key){
  var pool=key==='mix'?DATA:DATA.filter(function(q){return q.k===key});
  st={key:key,qs:shuffle(pool).slice(0,10),i:0,score:0,missed:[],cur:null};
  newQ();view='quiz';render();
}
function newQ(){st.cur={order:shuffle([0,1,2,3]),picked:null}}
function drawQ(){
  var x=t(),q=st.qs[st.i],d=q[L()==='rn'?'r':'e'],n=st.qs.length,c=st.cur,LT='ABCD';
  var h='<div class="top2"><span>'+x.qn+' '+(st.i+1)+' / '+n+'</span><span>'+x.score+': '+st.score+'</span></div><div class="bar"><i style="width:'+(st.i/n*100)+'%"></i></div>';
  h+='<div class="q">'+esc(d.q)+'</div><div id="opts">';
  c.order.forEach(function(oi,k){
    var cls='',mk='';
    if(c.picked!==null){if(oi===0){cls=' ok';mk='✓'}else if(oi===c.picked){cls=' no';mk='✗'}}
    h+='<button type="button" class="opt'+cls+'" data-o="'+oi+'"'+(c.picked!==null?' disabled':'')+'><span class="l">'+LT[k]+')</span><span>'+esc(d.o[oi])+'</span><span class="mark">'+mk+'</span></button>'});
  h+='</div><div id="fb">';
  if(c.picked!==null){var last=st.i===n-1,right=c.picked===0;
    h+='<div class="why"><b>'+(right?x.right:x.wrong+esc(d.o[0])+'. ')+'</b>'+esc(d.y)+'</div><button type="button" class="cta" id="nx">'+(last?x.res:x.next)+'</button>'}
  h+='</div>';
  scr.innerHTML=h;scr.scrollTop=0;
  Array.prototype.forEach.call(scr.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(parseInt(b.getAttribute('data-o'),10))}});
  var nx=document.getElementById('nx');if(nx){nx.focus();nx.onclick=function(){if(st.i===n-1){finish()}else{st.i++;newQ();render()}}}
}
function pick(oi){
  if(st.cur.picked!==null)return;
  st.cur.picked=oi;
  if(oi===0)st.score++;else st.missed.push(st.qs[st.i]);
  drawQ();
}
function finish(){
  saveBest(st.key,st.score,st.qs.length);view='result';render();
}
function drawResult(){
  var x=t(),n=st.qs.length,s=st.score,p=s/n*100,lg=L();
  var msg=p>=90?x.m90:p>=70?x.m70:p>=50?x.m50:x.m0;
  var sub=SUBJECTS.filter(function(z){return z.key===st.key})[0];
  var name=sub?sname(sub):x.mixn;
  var h='<div class="score"><div class="n">'+s+'/'+n+'</div><p>'+msg+'</p></div>';
  h+='<a class="cta wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(x.share(name,s,n))+'">'+x.wa+'</a>';
  h+='<button type="button" class="cta" id="again">'+x.again+'</button><button type="button" class="cta ghost" id="hm">'+x.other+'</button>';
  if(st.missed.length){h+='<h2>'+x.missed+' ('+st.missed.length+')</h2>';st.missed.forEach(function(q){var d=q[lg==='rn'?'r':'e'];h+='<div class="rev"><p><b>'+esc(d.q)+'</b></p><p>'+x.ca+esc(d.o[0])+'</p><p class="dim">'+esc(d.y)+'</p></div>'})}
  h+='<h2>'+x.more+'</h2><div class="links">'+(sub?'<a href="/'+sub.page+'.html">'+esc(sname(sub))+x.mcqsOf+'</a><a href="'+sub.guide+'">'+x.guide+'</a>':'<a href="/mcqs.html">'+x.all+'</a>')+'<a href="/">'+x.tutor+'</a></div>';
  scr.innerHTML=h;scr.scrollTop=0;
  document.getElementById('again').onclick=function(){start(st.key)};
  document.getElementById('hm').onclick=goHome;
}
homeBtn.onclick=goHome;
document.addEventListener('langchange',render);
render();
</script></body></html>
