<script>
var DATA=[{"k": "newton-laws-of-motion", "q": "Newton ka pehla law kis naam se bhi jana jata hai?", "c": "Law of inertia", "w": ["Law of acceleration", "Law of action and reaction", "Law of gravitation"], "y": "Pehla law batata hai ke koi cheez apni halat (rest ya motion) tab tak nahi badalti jab tak us par net force na lage, isay law of inertia kehte hain."}, {"k": "newton-laws-of-motion", "q": "Force ki SI unit kya hai?", "c": "Newton", "w": ["Joule", "Watt", "Pascal"], "y": "Force ki SI unit newton (N) hai. 1 N = 1 kg m/s²."}, {"k": "newton-laws-of-motion", "q": "Ek 5 kg ke jism ka acceleration 2 m/s² hai. Us par kitni force lag rahi hai?", "c": "10 N", "w": ["2.5 N", "7 N", "3 N"], "y": "Doosre law ke mutabiq F = ma = 5 × 2 = 10 N."}, {"k": "newton-laws-of-motion", "q": "Newton ke teesre law ke mutabiq action aur reaction forces:", "c": "barabar aur ulti simt mein hoti hain aur alag alag jismon par lagti hain", "w": ["barabar hoti hain aur ek hi jism par lagti hain", "ek doosre ko khatam kar deti hain kyunke wo ek hi jism par hoti hain", "hamesha ek doosre se kam ya zyada hoti hain"], "y": "Action aur reaction ki force barabar aur ulti simt me hoti hain, lekin do alag jismon par lagti hain, isliye wo ek doosre ko cancel nahi karti."}, {"k": "newton-laws-of-motion", "q": "Kisi jism ki inertia kis par depend karti hai?", "c": "Us ke mass par", "w": ["Us ki raftaar par", "Us ke rang par", "Us ki jagah par"], "y": "Mass jitna zyada ho, inertia utni zyada hoti hai."}, {"k": "newton-laws-of-motion", "q": "Momentum ka formula kya hai?", "c": "p = mv", "w": ["p = ma", "p = m/v", "p = F/t"], "y": "Momentum mass aur velocity ka hasil e zarb hai, yani p = mv. Unit kg m/s."}, {"k": "newton-laws-of-motion", "q": "Raaket ke oopar jane ki wajah kaun sa law hai?", "c": "Newton ka teesra law", "w": ["Newton ka pehla law", "Newton ka doosra law", "Boyle ka law"], "y": "Raaket gas ko neeche dhakelta hai (action), aur gas raaket ko oopar dhakelti hai (reaction). Ye teesra law hai."}, {"k": "newton-laws-of-motion", "q": "Agar kisi jism par lagne wali net force zero ho, to jism:", "c": "rest ya yaksan raftaar se seedhi line me chalta rehta hai", "w": ["hamesha rukk jata hai", "tezi se barhta jata hai", "ghoomne lagta hai"], "y": "Pehle law ke mutabiq net force zero ho to velocity nahi badalti."}, {"k": "newton-laws-of-motion", "q": "Bus achanak brake lagaye to musafir aage ki taraf jhuk jate hain. Iski wajah kya hai?", "c": "Inertia", "w": ["Gravity", "Friction", "Buoyancy"], "y": "Musafiron ka jism apni motion ki halat me rehna chahta hai, isliye aage jhukta hai."}, {"k": "newton-laws-of-motion", "q": "2 kg ke jism ko 3 m/s² ka acceleration dene ke liye kitni force chahiye?", "c": "6 N", "w": ["1.5 N", "5 N", "0.67 N"], "y": "F = ma = 2 × 3 = 6 N."}, {"k": "newton-laws-of-motion", "q": "10 kg ke jism ka weight zameen par kitna hoga? (g = 9.8 m/s²)", "c": "98 N", "w": ["10 N", "9.8 N", "980 N"], "y": "Weight W = mg = 10 × 9.8 = 98 N."}, {"k": "newton-laws-of-motion", "q": "1 newton barabar hai:", "c": "1 kg m/s²", "w": ["1 kg m/s", "1 g m/s²", "1 kg m²/s²"], "y": "F = ma se 1 N = 1 kg × 1 m/s² = 1 kg m/s²."}, {"k": "periodic-table-chemistry", "q": "Modern periodic law ke mutabiq elements ki properties kis ka periodic function hain?", "c": "Atomic number", "w": ["Atomic mass", "Number of neutrons", "Atomic radius"], "y": "Moseley ke kaam ke baad periodic law atomic number par mabni hai. Mendeleev ne atomic mass use kiya tha."}, {"k": "periodic-table-chemistry", "q": "Modern periodic table me kitne groups hain?", "c": "18", "w": ["8", "16", "7"], "y": "Modern periodic table me 18 groups aur 7 periods hote hain."}, {"k": "periodic-table-chemistry", "q": "Modern periodic table me kitne periods hain?", "c": "7", "w": ["8", "18", "6"], "y": "Periods ki tadad 7 hai."}, {"k": "periodic-table-chemistry", "q": "Sab se zyada electronegative element kaun sa hai?", "c": "Fluorine", "w": ["Oxygen", "Chlorine", "Nitrogen"], "y": "Fluorine ki electronegativity sab se zyada hai (Pauling scale par 4.0)."}, {"k": "periodic-table-chemistry", "q": "Noble gases kis group me aati hain?", "c": "Group 18", "w": ["Group 1", "Group 17", "Group 2"], "y": "Helium, neon, argon wagaira group 18 me hain."}, {"k": "periodic-table-chemistry", "q": "Period me left se right jane par atomic radius:", "c": "kam hota hai", "w": ["barhta hai", "badalta nahi", "pehle barhta phir kam hota hai"], "y": "Nuclear charge barhne se electrons nucleus ki taraf zyada khinchte hain, isliye radius kam hota hai."}, {"k": "periodic-table-chemistry", "q": "Group me oopar se neeche jane par ionization energy:", "c": "kam hoti hai", "w": ["barhti hai", "barabar rehti hai", "pehle kam phir zyada hoti hai"], "y": "Bahari electron nucleus se door hota hai, isliye usay nikalna aasan hota hai."}, {"k": "periodic-table-chemistry", "q": "Halogens kis group ke elements hain?", "c": "Group 17", "w": ["Group 1", "Group 2", "Group 18"], "y": "Fluorine, chlorine, bromine, iodine group 17 me hain."}, {"k": "periodic-table-chemistry", "q": "Atomic number 11 wala element kaun sa hai?", "c": "Sodium", "w": ["Magnesium", "Neon", "Potassium"], "y": "Sodium (Na) ka atomic number 11 hai."}, {"k": "periodic-table-chemistry", "q": "In me se kaun sa noble gas hai?", "c": "Argon", "w": ["Nitrogen", "Oxygen", "Chlorine"], "y": "Argon (Ar) group 18 ka noble gas hai."}, {"k": "periodic-table-chemistry", "q": "Mendeleev ne elements ko kis tarteeb me rakha tha?", "c": "Barhte hue atomic mass ke mutabiq", "w": ["Barhte hue atomic number ke mutabiq", "Alphabet ki tarteeb me", "Rang ke mutabiq"], "y": "Mendeleev ka periodic table atomic mass par bana tha, jabke modern table atomic number par."}, {"k": "periodic-table-chemistry", "q": "Group 1 me Li, Na, K, Rb me se sab se bara atomic radius kis ka hai?", "c": "Rb", "w": ["Li", "Na", "K"], "y": "Group me neeche jane par naye shells aate hain, isliye Rb sab se neeche hone ki wajah se sab se bara hai."}, {"k": "cell-biology", "q": "Cell ka \"powerhouse\" kise kaha jata hai?", "c": "Mitochondria", "w": ["Ribosome", "Golgi apparatus", "Lysosome"], "y": "Mitochondria cellular respiration se ATP (energy) banate hain."}, {"k": "cell-biology", "q": "Protein synthesis kahan hoti hai?", "c": "Ribosome", "w": ["Lysosome", "Vacuole", "Centriole"], "y": "Ribosomes par amino acids jor kar protein banaye jate hain."}, {"k": "cell-biology", "q": "Plant cell ki cell wall kis cheez ki bani hoti hai?", "c": "Cellulose", "w": ["Chitin", "Peptidoglycan", "Protein"], "y": "Plants ki cell wall cellulose ki hoti hai. Fungi me chitin hoti hai."}, {"k": "cell-biology", "q": "Photosynthesis cell ke kis organelle me hoti hai?", "c": "Chloroplast", "w": ["Mitochondria", "Nucleus", "Golgi apparatus"], "y": "Chloroplast me chlorophyll hota hai aur photosynthesis wahin hoti hai."}, {"k": "cell-biology", "q": "Cell ke kaamon ko kaun control karta hai?", "c": "Nucleus", "w": ["Ribosome", "Cell membrane", "Vacuole"], "y": "Nucleus me DNA hota hai jo cell ke kaam control karta hai."}, {"k": "cell-biology", "q": "Prokaryotic cells me kya nahi hota?", "c": "Membrane wala asli nucleus", "w": ["Ribosome", "DNA", "Cell membrane"], "y": "Prokaryotes me nucleus ghilaf wala nahi hota, DNA cytoplasm me hota hai."}, {"k": "cell-biology", "q": "Digestive enzymes kis organelle me hote hain?", "c": "Lysosome", "w": ["Ribosome", "Chloroplast", "Nucleolus"], "y": "Lysosomes me hazma karne wale enzymes hote hain."}, {"k": "cell-biology", "q": "Cell membrane ka fluid mosaic model kis ne pesh kiya?", "c": "Singer aur Nicolson", "w": ["Robert Hooke", "Schleiden aur Schwann", "Watson aur Crick"], "y": "Fluid mosaic model 1972 me Singer aur Nicolson ne diya."}, {"k": "cell-biology", "q": "Rough ER ko rough kyun kaha jata hai?", "c": "Is ki satah par ribosomes hote hain", "w": ["Is me DNA hota hai", "Is me chlorophyll hota hai", "Is ki jhilli nahi hoti"], "y": "Ribosomes ki wajah se satah khurdari lagti hai."}, {"k": "cell-biology", "q": "Cell ko sab se pehle kis ne dekha aur naam diya?", "c": "Robert Hooke", "w": ["Louis Pasteur", "Gregor Mendel", "Charles Darwin"], "y": "Robert Hooke ne 1665 me cork ke tukde me cells dekhe."}, {"k": "cell-biology", "q": "Proteins ko tabdeel kar ke pack aur bhejne ka kaam kis organelle ka hai?", "c": "Golgi apparatus", "w": ["Mitochondria", "Lysosome", "Nucleolus"], "y": "Golgi apparatus proteins ko modify, pack aur cell ke andar ya bahar bhejta hai."}, {"k": "cell-biology", "q": "In me se kaun sa animal cell me nahi hota?", "c": "Cell wall", "w": ["Nucleus", "Mitochondria", "Plasma membrane"], "y": "Animal cell me cell wall nahi hoti, ye plant, fungi aur bacteria me hoti hai."}, {"k": "english-tenses", "q": "She ___ to school every day.", "c": "goes", "w": ["go", "going", "gone"], "y": "Third person singular (she) ke sath simple present me verb ke sath s/es lagta hai."}, {"k": "english-tenses", "q": "They ___ cricket now.", "c": "are playing", "w": ["play", "played", "have played"], "y": "\"now\" ka matlab abhi ho raha hai, isliye present continuous: are playing."}, {"k": "english-tenses", "q": "I ___ my homework yesterday.", "c": "did", "w": ["do", "have done", "am doing"], "y": "\"yesterday\" guzra hua waqt hai, to simple past ka \"did\" aata hai."}, {"k": "english-tenses", "q": "He has ___ his work.", "c": "finished", "w": ["finish", "finishing", "finishes"], "y": "Present perfect me has/have ke baad verb ki third form (finished) aati hai."}, {"k": "english-tenses", "q": "We ___ been waiting for an hour.", "c": "have", "w": ["has", "are", "will"], "y": "Present perfect continuous: have/has + been + verb-ing. We ke sath have aata hai."}, {"k": "english-tenses", "q": "By next year, she ___ graduated.", "c": "will have", "w": ["has", "had", "is"], "y": "Future perfect: will have + third form of verb."}, {"k": "english-tenses", "q": "The sun ___ in the east.", "c": "rises", "w": ["rise", "rose", "rising"], "y": "Aam sachai simple present me hoti hai. Sun third person singular hai, to rises."}, {"k": "english-tenses", "q": "I ___ TV when the light went out.", "c": "was watching", "w": ["watch", "am watching", "have watched"], "y": "Guzre hue waqt me jari kaam par past continuous: was/were + verb-ing."}, {"k": "english-tenses", "q": "\"She has been studying since morning.\" Ye kaun sa tense hai?", "c": "Present perfect continuous", "w": ["Present continuous", "Past perfect", "Simple present"], "y": "has been + verb-ing present perfect continuous hai."}, {"k": "english-tenses", "q": "He ___ here since 2020.", "c": "has lived", "w": ["lives", "lived", "is living"], "y": "\"since\" ke sath present perfect aata hai: has/have + third form."}, {"k": "english-tenses", "q": "If it rains, we ___ at home.", "c": "will stay", "w": ["stayed", "would stay", "stay"], "y": "First conditional: if + simple present, will + verb."}, {"k": "english-tenses", "q": "\"The train had left before we reached.\" Ye kaun sa tense hai?", "c": "Past perfect", "w": ["Present perfect", "Simple past", "Past continuous"], "y": "had + third form past perfect hai. Ye do guzre hue kamon me pehle hone wale kaam ko dikhata hai."}, {"k": "pakistan-movement-pakistan-studies", "q": "All India Muslim League kab aur kahan qaim hui?", "c": "1906, Dhaka", "w": ["1885, Bombay", "1930, Allahabad", "1940, Lahore"], "y": "Muslim League 30 December 1906 ko Dhaka me qaim hui."}, {"k": "pakistan-movement-pakistan-studies", "q": "Qarardad-e-Pakistan (Lahore Resolution) kab pesh hui?", "c": "23 March 1940", "w": ["14 August 1947", "23 March 1956", "11 September 1948"], "y": "Ye qarardad Lahore me 23 March 1940 ko pesh hui."}, {"k": "pakistan-movement-pakistan-studies", "q": "Qarardad-e-Lahore kis ne pesh ki?", "c": "A. K. Fazlul Haq", "w": ["Allama Iqbal", "Liaquat Ali Khan", "Chaudhry Rehmat Ali"], "y": "Qarardad A. K. Fazlul Haq (Sher-e-Bangal) ne pesh ki."}, {"k": "pakistan-movement-pakistan-studies", "q": "Allahabad ka khutba 1930 me kis ne diya?", "c": "Allama Muhammad Iqbal", "w": ["Quaid-e-Azam", "Sir Syed Ahmad Khan", "Maulana Muhammad Ali Jauhar"], "y": "Allama Iqbal ne 1930 me Muslim League ke Allahabad ijlas me alag Muslim riyasat ka tasawwur pesh kiya."}, {"k": "pakistan-movement-pakistan-studies", "q": "Quaid-e-Azam Muhammad Ali Jinnah kab aur kahan paida huye?", "c": "25 December 1876, Karachi", "w": ["25 December 1876, Lahore", "11 September 1876, Karachi", "14 August 1876, Dhaka"], "y": "Quaid-e-Azam 25 December 1876 ko Karachi me paida huye."}, {"k": "pakistan-movement-pakistan-studies", "q": "Lucknow Pact kis saal hua?", "c": "1916", "w": ["1906", "1930", "1947"], "y": "Muslim League aur Congress ke darmiyan Lucknow Pact 1916 me hua."}, {"k": "pakistan-movement-pakistan-studies", "q": "Pakistan kab wujood me aaya?", "c": "14 August 1947", "w": ["15 August 1947", "23 March 1940", "3 June 1947"], "y": "Pakistan 14 August 1947 ko (27 Ramzan) wujood me aaya."}, {"k": "pakistan-movement-pakistan-studies", "q": "Jinnah ke 14 points kis saal pesh huye?", "c": "1929", "w": ["1916", "1935", "1940"], "y": "Quaid-e-Azam ne Nehru Report ke jawab me 1929 me 14 points pesh kiye."}, {"k": "pakistan-movement-pakistan-studies", "q": "Government of India Act kis saal manzoor hua?", "c": "1935", "w": ["1909", "1919", "1947"], "y": "Government of India Act 1935 me nafiz hua."}, {"k": "pakistan-movement-pakistan-studies", "q": "Pakistan ke pehle wazir-e-azam kaun the?", "c": "Liaquat Ali Khan", "w": ["Khawaja Nazimuddin", "Ghulam Muhammad", "Huseyn Shaheed Suhrawardy"], "y": "Liaquat Ali Khan Pakistan ke pehle wazir-e-azam the."}, {"k": "pakistan-movement-pakistan-studies", "q": "Cabinet Mission kis saal Hindustan aaya?", "c": "1946", "w": ["1940", "1935", "1950"], "y": "Cabinet Mission March 1946 me Hindustan aaya."}, {"k": "pakistan-movement-pakistan-studies", "q": "Hindustan aur Pakistan ki sarhad tay karne wale boundary commission ka sarbarah kaun tha?", "c": "Cyril Radcliffe", "w": ["Lord Mountbatten", "Lord Wavell", "Stafford Cripps"], "y": "Radcliffe commission ka sarbarah Sir Cyril Radcliffe tha."}, {"k": "computer-science-basics", "q": "CPU ka poora naam kya hai?", "c": "Central Processing Unit", "w": ["Central Program Unit", "Computer Personal Unit", "Control Processing Utility"], "y": "CPU computer ka processor hai jo instructions chalata hai."}, {"k": "computer-science-basics", "q": "1 byte me kitne bits hote hain?", "c": "8", "w": ["4", "16", "10"], "y": "1 byte = 8 bits."}, {"k": "computer-science-basics", "q": "Decimal number 5 ka binary kya hai?", "c": "101", "w": ["110", "100", "111"], "y": "5 = 4 + 1, yani 1×2² + 0×2¹ + 1×2⁰ = 101."}, {"k": "computer-science-basics", "q": "In me se kaun sa output device hai?", "c": "Monitor", "w": ["Keyboard", "Mouse", "Scanner"], "y": "Monitor maloomat dikhata hai, isliye output device hai."}, {"k": "computer-science-basics", "q": "RAM kis qism ki memory hai?", "c": "Volatile memory (bijli band hone par data khatam)", "w": ["Non-volatile memory", "Sirf parhne wali memory", "Permanent storage"], "y": "RAM ka data bijli band hone par khatam ho jata hai."}, {"k": "computer-science-basics", "q": "HTML ka poora naam kya hai?", "c": "HyperText Markup Language", "w": ["HyperText Making Language", "High Text Machine Language", "Home Tool Markup Language"], "y": "HTML web pages banane ki markup language hai."}, {"k": "computer-science-basics", "q": "1 KB (kilobyte) barabar hai:", "c": "1024 bytes", "w": ["1000 bytes", "100 bytes", "8 bytes"], "y": "Computing me 1 KB = 1024 bytes hota hai."}, {"k": "computer-science-basics", "q": "Computer ka \"dimagh\" kise kaha jata hai?", "c": "CPU", "w": ["Monitor", "Keyboard", "Printer"], "y": "CPU saare processing kaam karta hai, isliye usay dimagh kehte hain."}, {"k": "computer-science-basics", "q": "In me se kaun sa operating system hai?", "c": "Windows", "w": ["Microsoft Word", "Google Chrome", "Adobe Reader"], "y": "Windows ek operating system hai, baqi application software hain."}, {"k": "computer-science-basics", "q": "In me se kaun sa input device hai?", "c": "Mouse", "w": ["Monitor", "Speaker", "Printer"], "y": "Mouse computer ko input deta hai."}, {"k": "computer-science-basics", "q": "Binary number 1010 ka decimal kya hoga?", "c": "10", "w": ["12", "8", "5"], "y": "1010 = 1×8 + 0×4 + 1×2 + 0×1 = 10."}, {"k": "computer-science-basics", "q": "URL ka poora naam kya hai?", "c": "Uniform Resource Locator", "w": ["Universal Resource Link", "Uniform Reference Locator", "United Resource Line"], "y": "URL kisi web page ka pata (address) hota hai."}];
var SUBJECTS=[{"key": "newton-laws-of-motion", "name": "Physics", "level": "Class 9, 10, FSc aur MDCAT", "icon": "⚡", "page": "mcq-newton-laws-of-motion", "guide": "/guide-newton-ke-teen-laws.html"}, {"key": "periodic-table-chemistry", "name": "Chemistry", "level": "Class 9, 10, FSc aur MDCAT", "icon": "🧪", "page": "mcq-periodic-table-chemistry", "guide": "/guide-periodic-table-trends.html"}, {"key": "cell-biology", "name": "Biology", "level": "Class 9, FSc aur MDCAT", "icon": "🧬", "page": "mcq-cell-biology", "guide": "/guide-cell-organelles-functions.html"}, {"key": "english-tenses", "name": "English", "level": "Class 9, 10 aur FSc", "icon": "📝", "page": "mcq-english-tenses", "guide": "/guide-english-tenses-chart.html"}, {"key": "pakistan-movement-pakistan-studies", "name": "Pakistan Studies", "level": "Class 9, 10 aur FSc", "icon": "🇵🇰", "page": "mcq-pakistan-movement-pakistan-studies", "guide": "/guide-qarardad-e-pakistan-1940.html"}, {"key": "computer-science-basics", "name": "Computer Science", "level": "Class 9, 10 aur FSc", "icon": "💻", "page": "mcq-computer-science-basics", "guide": "/guide-binary-number-system.html"}];
var SITE='https://www.rehnuma-ai.com/quiz.html';
var scr=document.getElementById('scr'),homeBtn=document.getElementById('homeBtn');
var st={};
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function best(key){try{return localStorage.getItem('rq_best_'+key)}catch(e){return null}}
function saveBest(key,s,n){try{var o=best(key);var p=o?parseInt(o.split('/')[0],10):-1;if(s>p)localStorage.setItem('rq_best_'+key,s+'/'+n)}catch(e){}}
function home(){
  st={};homeBtn.hidden=true;
  var h='<h1>Apna MCQ test khelein</h1><p class="dim">Matric, FSc aur MDCAT ke MCQs. Har sawal ke baad foran sahi jawab aur wajah. Free hai, login ki zaroorat nahi.</p><div class="grid">';
  h+='<button class="sub" type="button" data-k="mix"><span class="ic">🎯</span><span><b>Mix: sab subjects</b><span class="m">10 random sawal'+(best('mix')?' &middot; Best: '+best('mix'):'')+'</span></span></button>';
  SUBJECTS.forEach(function(s){h+='<button class="sub" type="button" data-k="'+esc(s.key)+'"><span class="ic">'+s.icon+'</span><span><b>'+esc(s.name)+'</b><span class="m">'+esc(s.level)+(best(s.key)?' &middot; Best: '+best(s.key):'')+'</span></span></button>'});
  h+='</div><h2>Parhna ho to</h2><div class="links"><a href="/mcqs.html">Sab MCQs jawab ke sath</a><a href="/guides.html">Study guides</a><a href="/">Rehnuma AI tutor</a></div>';
  h+='<footer>Ye MCQs Rehnuma ne apni tayyari ke liye banaye hain, official board ya test ke sawal nahi hain. Banane wali: <a href="/about.html">Javeria Maqsood</a>.</footer>';
  scr.innerHTML=h;scr.scrollTop=0;
  Array.prototype.forEach.call(scr.querySelectorAll('.sub'),function(b){b.onclick=function(){start(b.getAttribute('data-k'))}});
}
function start(key){
  var pool=key==='mix'?DATA:DATA.filter(function(q){return q.k===key});
  var qs=shuffle(pool).slice(0,10);
  st={key:key,qs:qs,i:0,score:0,missed:[],done:false};
  homeBtn.hidden=false;show();
}
function show(){
  var q=st.qs[st.i],n=st.qs.length;
  var opts=shuffle([q.c].concat(q.w));
  var L='ABCD';
  var h='<div class="top2"><span>Sawal '+(st.i+1)+' / '+n+'</span><span>Score: '+st.score+'</span></div><div class="bar"><i style="width:'+(st.i/n*100)+'%"></i></div>';
  h+='<div class="q">'+esc(q.q)+'</div><div id="opts">';
  opts.forEach(function(o,k){h+='<button type="button" class="opt" data-o="'+k+'"><span class="l">'+L[k]+')</span><span>'+esc(o)+'</span><span class="mark"></span></button>'});
  h+='</div><div id="fb"></div>';
  scr.innerHTML=h;scr.scrollTop=0;
  var btns=scr.querySelectorAll('.opt');
  Array.prototype.forEach.call(btns,function(b,k){b.onclick=function(){pick(b,opts[k],q,btns)}});
}
function pick(b,val,q,btns){
  var right=val===q.c;
  Array.prototype.forEach.call(btns,function(x){x.disabled=true;var t=x.children[1].textContent;if(t===q.c){x.classList.add('ok');x.querySelector('.mark').textContent='✓'}});
  if(right){st.score++}else{b.classList.add('no');b.querySelector('.mark').textContent='✗';st.missed.push(q)}
  var last=st.i===st.qs.length-1;
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="why"><b>'+(right?'Sahi! ':'Ghalat. Sahi jawab: '+esc(q.c)+'. ')+'</b>'+esc(q.y)+'</div><button type="button" class="cta" id="nx">'+(last?'Result dekhein':'Agla sawal')+'</button>';
  var nx=document.getElementById('nx');nx.focus();
  nx.onclick=function(){if(last){result()}else{st.i++;show()}};
  var s=document.querySelector('.top2 span:last-child');if(s)s.textContent='Score: '+st.score;
}
function result(){
  var n=st.qs.length,s=st.score,p=s/n*100;saveBest(st.key,s,n);
  var msg=p>=90?'Shabash! Zabardast tayyari.':p>=70?'Bohat acha! Thori si mehnat aur.':p>=50?'Theek hai. Ghalat sawal dobara parhein.':'Koi baat nahi. Parhein aur dobara try karein.';
  var name=st.key==='mix'?'Mix':(SUBJECTS.filter(function(x){return x.key===st.key})[0]||{}).name;
  var sub=SUBJECTS.filter(function(x){return x.key===st.key})[0];
  var text='Maine Rehnuma Quiz ('+name+') me '+s+'/'+n+' score kiya! Tum bhi try karo: '+SITE;
  var h='<div class="score"><div class="n">'+s+'/'+n+'</div><p>'+msg+'</p></div>';
  h+='<a class="cta wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(text)+'">WhatsApp par score bhejein</a>';
  h+='<button type="button" class="cta" id="again">Dobara khelein</button><button type="button" class="cta ghost" id="hm">Doosra subject</button>';
  if(st.missed.length){h+='<h2>Jo ghalat huye ('+st.missed.length+')</h2>';st.missed.forEach(function(q){h+='<div class="rev"><p><b>'+esc(q.q)+'</b></p><p>Sahi jawab: '+esc(q.c)+'</p><p class="dim">'+esc(q.y)+'</p></div>'})}
  h+='<h2>Aage parhein</h2><div class="links">'+(sub?'<a href="/'+sub.page+'.html">'+esc(sub.name)+' ke MCQs jawab ke sath</a><a href="'+sub.guide+'">Is topic ki guide</a>':'<a href="/mcqs.html">Sab MCQs jawab ke sath</a>')+'<a href="/">Rehnuma AI tutor se poochein</a></div>';
  scr.innerHTML=h;scr.scrollTop=0;
  document.getElementById('again').onclick=function(){start(st.key)};
  document.getElementById('hm').onclick=home;
}
homeBtn.onclick=home;
home();
</script></body></html>
